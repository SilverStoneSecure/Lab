services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: "3000"
      SESSION_SECURE: ${SESSION_SECURE:-0}
      RUN_MIGRATE_ON_START: ${RUN_MIGRATE_ON_START:-1}
      RUN_SEED_ON_START: ${RUN_SEED_ON_START:-0}
    volumes:
      - ../data:/app/data
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
